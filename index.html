<html lang="id" class="h-full">
 <head>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

    tailwind.config = {
      darkMode: 'class',
      theme: {

          }
        }
      }
    }

 </head>
 <body class="h-full bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
  <div id="app" class="h-full w-full overflow-auto"></div>
  <script>
// Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyBMfucE-eNjz8STwLx4S91imGLySlh-Ysk",
  authDomain: "webstore-f1f6c.firebaseapp.com",
  projectId: "webstore-f1f6c",
  storageBucket: "webstore-f1f6c.firebasestorage.app",
  messagingSenderId: "944790024138",
  appId: "1:944790024138:web:405441fbf5648976ffa933"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const storage = firebase.storage();

// State
let currentUser = null;
let userRole = 'user';
let currentPage = 'login';
let products = [];
let testimonials = [];
let darkMode = localStorage.getItem('darkMode') === 'true';
let searchQuery = '';
let filterType = 'all';
let selectedProduct = null;
let editingProduct = null;

if (darkMode) document.documentElement.classList.add('dark');

// Element SDK
const defaultConfig = {
  store_name: 'NexturaStore',
  whatsapp_number: '6281234567890',
  background_color: '#f9fafb',
  surface_color: '#ffffff',
  text_color: '#1f2937',
  primary_color: '#2563eb',
  secondary_color: '#60a5fa'
};

window.elementSdk.init({
  defaultConfig,
  onConfigChange: async (config) => {
    render();
  },
  mapToCapabilities: (config) => ({
    recolorables: [
      { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); }},
      { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); }},
      { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); }},
      { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); }},
      { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); }}
    ],
    borderables: [],
    fontEditable: undefined,
    fontSizeable: undefined
  }),
  mapToEditPanelValues: (config) => new Map([
    ['store_name', config.store_name || defaultConfig.store_name],
    ['whatsapp_number', config.whatsapp_number || defaultConfig.whatsapp_number]
  ])
});

const cfg = () => window.elementSdk.config || defaultConfig;

// Auth listener
auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    const doc = await db.collection('users').doc(user.uid).get();
    if (doc.exists) {
      userRole = doc.data().role || 'user';
    }
    if (currentPage === 'login' || currentPage === 'register') {
      currentPage = 'home';
    }
    loadProducts();
    loadTestimonials();
  } else {
    currentUser = null;
    userRole = 'user';
    currentPage = 'login';
  }
  render();
});

async function loadProducts() {
  try {
    const snap = await db.collection('products').orderBy('createdAt', 'desc').get();
    products = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  } catch(e) { console.error(e); }
}

async function loadTestimonials() {
  try {
    const snap = await db.collection('testimonials').orderBy('createdAt', 'desc').limit(20).get();
    testimonials = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  } catch(e) { console.error(e); }
}

// Auth functions
async function loginEmail(email, pw) {
  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch(e) { return e.message; }
  return null;
}

async function registerEmail(username, email, pw) {
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    await db.collection('users').doc(cred.user.uid).set({
      uid: cred.user.uid, username, email, role: 'user', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e) { return e.message; }
  return null;
}

async function loginGoogle() {
  try {
    const provider = new firebase.auth.GoogleAuthProvider();
    const cred = await auth.signInWithPopup(provider);
    const doc = await db.collection('users').doc(cred.user.uid).get();
    if (!doc.exists) {
      await db.collection('users').doc(cred.user.uid).set({
        uid: cred.user.uid, username: cred.user.displayName || 'User', email: cred.user.email, role: 'user', createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }
  } catch(e) { return e.message; }
  return null;
}

function logout() { auth.signOut(); }

// Product CRUD
async function addProduct(data, file) {
  let imageUrl = '';
  if (file) {
    const ref = storage.ref('products/' + Date.now() + '_' + file.name);
    await ref.put(file);
    imageUrl = await ref.getDownloadURL();
  }
  await db.collection('products').add({ ...data, imageUrl, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  loadProducts();
}

async function updateProduct(id, data, file) {
  let update = { ...data };
  if (file) {
    const ref = storage.ref('products/' + Date.now() + '_' + file.name);
    await ref.put(file);
    update.imageUrl = await ref.getDownloadURL();
  }
  await db.collection('products').doc(id).update(update);
  loadProducts();
}

async function deleteProduct(id) { await db.collection('products').doc(id).delete(); loadProducts(); }

async function addTestimonial(message) {
  const doc = await db.collection('users').doc(currentUser.uid).get();
  const username = doc.exists ? doc.data().username : 'User';
  await db.collection('testimonials').add({ userId: currentUser.uid, username, message, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  loadTestimonials();
}

async function deleteTestimonial(id) { await db.collection('testimonials').doc(id).delete(); loadTestimonials(); }

function navigate(page, data) {
  if (page === 'admin' && userRole !== 'admin') { currentPage = 'home'; render(); return; }
  currentPage = page;
  if (data) selectedProduct = data;
  render();
  document.getElementById('app').scrollTop = 0;
}

function toggleDark() {
  darkMode = !darkMode;
  localStorage.setItem('darkMode', darkMode);
  document.documentElement.classList.toggle('dark', darkMode);
  render();
}

function getFilteredProducts() {
  return products.filter(p => {
    const matchType = filterType === 'all' || p.type === filterType;
    const matchSearch = p.title.toLowerCase().includes(searchQuery.toLowerCase());
    return matchType && matchSearch;
  });
}

// Render
function render() {
  const app = document.getElementById('app');
  const c = cfg();
  const storeName = c.store_name || defaultConfig.store_name;
  const waNumber = c.whatsapp_number || defaultConfig.whatsapp_number;

  if (currentPage === 'login') { renderLogin(app, storeName); }
  else if (currentPage === 'register') { renderRegister(app, storeName); }
  else if (currentPage === 'home') { renderHome(app, storeName, waNumber); }
  else if (currentPage === 'detail') { renderDetail(app, storeName, waNumber); }
  else if (currentPage === 'admin') { renderAdmin(app, storeName); }

  lucide.createIcons();
}

      </div>

  // Event bindings
  document.getElementById('dark-toggle').onclick = toggleDark;
  document.getElementById('logout-btn').onclick = logout;
  const adminBtn = document.getElementById('nav-admin');
  if (adminBtn) adminBtn.onclick = () => navigate('admin');
  document.getElementById('search-input').oninput = (e) => { searchQuery = e.target.value; render(); };
  document.querySelectorAll('[data-filter]').forEach(btn => {
    btn.onclick = () => { filterType = btn.dataset.filter; render(); };
  });
  document.querySelectorAll('[data-product-id]').forEach(el => {
    el.onclick = () => { const p = products.find(x => x.id === el.dataset.productId); if (p) navigate('detail', p); };
  });
  document.getElementById('testi-form').onsubmit = async(e) => {
    e.preventDefault();
    const input = document.getElementById('testi-input');
    if (input.value.trim()) { await addTestimonial(input.value.trim()); }
  };
}
